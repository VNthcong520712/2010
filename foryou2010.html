<title>Cô Gái Và Mèo Đen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Bố cục: một sân khấu SVG cố định, cuộn trang để lật từng cảnh; lời kể nằm ở dải đất phía dưới */
:root{
  --bg:#fff4ec; --ink:#2b2d42; --card:rgba(255,255,255,.94); --line:rgba(43,45,66,.12);
  --accent:#e63946; --muted:#6d6875;
  --font:'Baloo 2', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1b29; --ink:#f3f1f7; --card:rgba(32,30,48,.92); --line:rgba(255,255,255,.14); --accent:#ff6b7a; --muted:#b7b2c4; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#1c1b29; --ink:#f3f1f7; --card:rgba(32,30,48,.92); --line:rgba(255,255,255,.14); --accent:#ff6b7a; --muted:#b7b2c4; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
#track{width:100%}
#stage{position:fixed;inset:0;overflow:hidden;background:#8ecae6;transition:background .6s ease}
#stage svg{width:100%;height:100%;display:block;font-family:var(--font)}
.scene{opacity:0;transition:opacity .55s ease}
.scene.on{opacity:1}

#cap{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(700px, calc(100% - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:20px;padding:10px 22px 12px;font-size:clamp(16px,2.1vw,21px);line-height:1.45;text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.16);transition:opacity .3s ease, transform .3s ease;text-wrap:balance}
#cap.hide{opacity:0;transform:translate(-50%,12px)}
#cap b{color:var(--accent);font-weight:800}
#cap .n{display:block;font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

#bar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:5px;width:0;background:var(--accent);z-index:5}

#intro{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:min(460px, calc(100% - 32px));
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:22px 26px 18px;
  text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.18);transition:opacity .4s ease, transform .4s ease;z-index:4}
#intro h1{margin:0;font-size:clamp(26px,4.4vw,38px);line-height:1.1;font-weight:800;text-wrap:balance}
#intro h1 span{color:var(--accent)}
#intro p{margin:8px 0 0;color:var(--muted);font-size:17px}
#intro .mouse{width:26px;height:40px;border:3px solid var(--ink);border-radius:14px;margin:14px auto 0;position:relative}
#intro .mouse::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--accent);animation:wheel 1.4s ease-in-out infinite}
#intro.gone{opacity:0;transform:translate(-50%,-56%);pointer-events:none}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}

/* hiệu ứng nền chạy liên tục */
.floatUp{animation:floatUp 2.6s linear infinite}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.wave{animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-14px);opacity:1}}
.twinkle{animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
@media (prefers-reduced-motion: reduce){
  .floatUp,.wave,.twinkle,.pulse,.breathe,#intro .mouse::after{animation:none}
  .scene,#cap{transition:none}
}
</style>

<div id="track"></div>
<div id="stage">
  <svg id="svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Câu chuyện cô gái và chú mèo đen"></svg>
</div>
<div id="bar"></div>
<div id="intro">
  <h1>Cô gái &amp; <span>chú mèo đen</span></h1>
  <p>Một chuyến đi Thái Lan, mang về một người bạn nhỏ.</p>
  <div class="mouse" aria-hidden="true"></div>
  <p>Lăn chuột (hoặc vuốt) để bắt đầu</p>
</div>
<div id="cap" class="hide" aria-live="polite"></div>

<script>
/* ---------- tiện ích ---------- */
const SKIN='#f6c9a0', HAIR='#3d2314', DRESS='#e63946', BLK='#151515';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const pop=t=>{if(t<=0)return 0;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const rep=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
function place(id,x,y,s=1,flip=false,rot=0){$(id).setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${(flip?-s:s).toFixed(3)} ${s.toFixed(3)})`)}
function op(id,v){$(id).setAttribute('opacity',clamp(v).toFixed(3))}
function show(id,attr,val){$(id).querySelectorAll(`[data-${attr}]`).forEach(e=>e.setAttribute('opacity',e.dataset[attr]===val?1:0))}
const face=(id,m)=>show(id,'e',m);
const arm=(id,m)=>show(id,'a',m);
function walk(id,ph,amp=24){
  const el=$(id),a=Math.sin(ph)*amp;
  el.querySelector('.legL').setAttribute('transform',`rotate(${a.toFixed(1)} -7.5 -62)`);
  el.querySelector('.legR').setAttribute('transform',`rotate(${(-a).toFixed(1)} 7.5 -62)`);
  el.querySelector('.gb').setAttribute('transform',`translate(0 ${(-Math.abs(Math.cos(ph))*3).toFixed(1)})`);
}
function catWalk(id,ph,amp=26){
  const el=$(id),a=Math.sin(ph)*amp;
  [['l1',a,-13.5],['l2',-a,-3.5],['l3',-a,9.5],['l4',a,18.5]].forEach(([c,r,x])=>el.querySelector('.'+c).setAttribute('transform',`rotate(${r.toFixed(1)} ${x} -15)`));
  el.querySelector('.tail').setAttribute('transform',`rotate(${(Math.sin(ph*.5)*8).toFixed(1)} -20 -20)`);
}
function catHead(id,dy=0,rot=0){$(id).querySelector('.hd').setAttribute('transform',`translate(0 ${dy.toFixed(1)}) rotate(${rot.toFixed(1)} 23 -37)`)}

/* ---------- nhân vật ---------- */
function girl(id,o={}){
  const limb=d=>`<path d="${d}" stroke="${SKIN}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  const arms=o.arms||['down'];
  const front={
    down:limb('M15,-112 Q24,-96 25,-78'),
    reach:limb('M15,-112 Q32,-104 50,-98')+`<circle cx="50" cy="-98" r="4.5" fill="${SKIN}"/>`,
    pillow:`<rect x="12" y="-115" width="48" height="31" rx="8" fill="#ffc8dd" stroke="#ff8fab" stroke-width="3"/>
      <rect x="17.5" y="-109.5" width="37" height="20" rx="5" fill="none" stroke="#ff8fab" stroke-width="1.6" stroke-dasharray="3 3"/>`
      +limb('M14,-112 Q22,-84 52,-93')+`<circle cx="52" cy="-93" r="4.5" fill="${SKIN}"/>`,
    camera:limb('M15,-112 Q32,-118 30,-146')+`<rect x="24" y="-163" width="28" height="19" rx="4" fill="#222"/>
      <rect x="28" y="-167" width="9" height="5" rx="1.5" fill="#222"/><circle cx="40" cy="-153.5" r="5.5" fill="#5390d9" stroke="#ddd" stroke-width="2"/>
      <circle class="fl" cx="56" cy="-158" r="22" fill="#fff" opacity="0"/>`
  };
  let s=`<g id="${id}"><g class="gb">`;
  if(o.suitcase) s+=`<line x1="-58" y1="-87" x2="-87" y2="-57" stroke="#6c757d" stroke-width="4" stroke-linecap="round"/>
    <g transform="rotate(-10 -78 -2)"><rect x="-100" y="-58" width="44" height="54" rx="7" fill="#2a9d8f" stroke="#1d6f66" stroke-width="3"/>
    <line x1="-88" y1="-50" x2="-88" y2="-12" stroke="#1d6f66" stroke-width="3"/><line x1="-68" y1="-50" x2="-68" y2="-12" stroke="#1d6f66" stroke-width="3"/>
    <circle cx="-92" cy="-2" r="5" fill="#333"/><circle cx="-64" cy="-2" r="5" fill="#333"/></g>`;
  if(o.pack!==false) s+=pack(0,0);
  s+=`<g class="legL"><rect x="-12" y="-64" width="9" height="62" rx="4" fill="${SKIN}"/><ellipse cx="-5" cy="-3" rx="9" ry="5" fill="#333"/></g>
    <g class="legR"><rect x="3" y="-64" width="9" height="62" rx="4" fill="${SKIN}"/><ellipse cx="10" cy="-3" rx="9" ry="5" fill="#333"/></g>
    <path d="M-15,-118 Q0,-122 15,-118 L30,-56 Q0,-50 -30,-56 Z" fill="${DRESS}"/>
    <path d="M-7,-119 L0,-110 L7,-119 Z" fill="#fff"/>`;
  if(o.pack!==false) s+=`<path d="M-11,-117 L-9,-86" stroke="#c4561a" stroke-width="4" stroke-linecap="round"/>`;
  s+= o.suitcase? limb('M-15,-112 Q-36,-100 -58,-87') : limb('M-15,-112 Q-24,-96 -25,-78');
  s+=`<rect x="-5" y="-127" width="10" height="10" fill="${SKIN}"/>
    <path d="M-29,-146 Q-31,-178 0,-178 Q31,-178 29,-146 L31,-108 Q22,-104 16,-112 L-16,-112 Q-22,-104 -31,-108 Z" fill="${HAIR}"/>
    <circle cx="0" cy="-146" r="25" fill="${SKIN}"/>
    <path d="M-27,-146 Q-27,-175 0,-174 Q27,-175 27,-146 Q22,-160 8,-162 Q2,-152 -8,-160 Q-18,-156 -27,-146 Z" fill="${HAIR}"/>
    <circle cx="19" cy="-166" r="5.5" fill="#ff4d6d"/>
    <ellipse cx="-15" cy="-136" rx="5" ry="3.5" fill="#ff8fab" opacity=".7"/><ellipse cx="15" cy="-136" rx="5" ry="3.5" fill="#ff8fab" opacity=".7"/>
    <g data-e="n"><circle cx="-9" cy="-145" r="3.3" fill="#222"/><circle cx="9" cy="-145" r="3.3" fill="#222"/><circle cx="-8" cy="-146" r="1" fill="#fff"/><circle cx="10" cy="-146" r="1" fill="#fff"/></g>
    <g data-e="h" opacity="0"><path d="M-13,-144 Q-9,-150 -5,-144 M5,-144 Q9,-150 13,-144" stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>`;
  s+= o.mouth==='o'? `<ellipse cx="0" cy="-131" rx="3.5" ry="4.5" fill="#a4161a"/>`
                    : `<path d="M-6,-134 Q0,-128 6,-134" stroke="#a4161a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  arms.forEach((a,i)=>{ s+=`<g data-a="${a}" opacity="${i?0:1}">${front[a]}</g>` });
  return s+`</g></g>`;
}
function pack(x,y){
  return `<g transform="translate(${x} ${y})"><rect x="-56" y="-122" width="44" height="58" rx="10" fill="#f37021" stroke="#c4561a" stroke-width="3"/>
    <rect x="-53" y="-103" width="31" height="17" rx="3" fill="#fff"/>
    <text x="-37.5" y="-89.6" text-anchor="middle" font-size="13.5" font-weight="900" font-family="Arial,Helvetica,sans-serif"><tspan fill="#0f5aa6">F</tspan><tspan fill="#f37021">P</tspan><tspan fill="#3cb54a">T</tspan></text></g>`;
}
const catEyes=(cx1,cx2,cy,big=1)=>`
  <g data-e="n"><ellipse cx="${cx1}" cy="${cy}" rx="${3.4*big}" ry="${4.2*big}" fill="#ffd60a"/><ellipse cx="${cx2}" cy="${cy}" rx="${3.4*big}" ry="${4.2*big}" fill="#ffd60a"/>
    <ellipse cx="${cx1+.4}" cy="${cy}" rx="${1.3*big}" ry="${3.2*big}" fill="#111"/><ellipse cx="${cx2+.4}" cy="${cy}" rx="${1.3*big}" ry="${3.2*big}" fill="#111"/></g>
  <g data-e="h" opacity="0"><path d="M${cx1-3.5*big},${cy+1} Q${cx1},${cy-5*big} ${cx1+3.5*big},${cy+1} M${cx2-3.5*big},${cy+1} Q${cx2},${cy-5*big} ${cx2+3.5*big},${cy+1}" stroke="#ffd60a" stroke-width="${2.3*big}" fill="none" stroke-linecap="round"/></g>
  <g data-e="s" opacity="0"><path d="M${cx1-3.5*big},${cy-3*big} L${cx1+2.5*big},${cy} L${cx1-3.5*big},${cy+3*big} M${cx2+3.5*big},${cy-3*big} L${cx2-2.5*big},${cy} L${cx2+3.5*big},${cy+3*big}" stroke="#ffd60a" stroke-width="${2.1*big}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
function cat(id){
  const leg=(c,x)=>`<rect class="${c}" x="${x}" y="-15" width="7" height="15" rx="3" fill="${BLK}"/>`;
  return `<g id="${id}"><g class="cb">
    <path class="tail" d="M-20,-20 Q-42,-22 -36,-50" stroke="${BLK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    ${leg('l1',-17)}${leg('l2',-7)}${leg('l3',6)}${leg('l4',15)}
    <ellipse cx="0" cy="-21" rx="24" ry="13" fill="${BLK}"/>
    <g class="hd">
      <path d="M11,-42 L13,-59 L23,-47 Z M24,-47 L34,-59 L35,-42 Z" fill="${BLK}"/>
      <path d="M14,-47 L15,-54 L20,-49 Z M27,-49 L32,-54 L32,-47 Z" fill="#ff8fab"/>
      <circle cx="23" cy="-37" r="13" fill="${BLK}"/>
      ${catEyes(18,29,-39)}
      <path d="M22,-33 l3.4,0 l-1.7,2.2 z" fill="#ff8fab"/>
      <path d="M33,-33 l11,-2.5 M33,-31 l11,1 M14,-33 l-9,-2" stroke="#9a9a9a" stroke-width=".9"/>
    </g></g></g>`;
}
function catSit(id){
  return `<g id="${id}"><g class="cb">
    <path d="M14,-8 Q42,-12 34,-44" stroke="${BLK}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-27" rx="19" ry="26" fill="${BLK}"/>
    <ellipse cx="-8" cy="-3" rx="7" ry="4.5" fill="${BLK}"/><ellipse cx="8" cy="-3" rx="7" ry="4.5" fill="${BLK}"/>
    <g class="hd">
      <path d="M-16,-62 L-15,-86 L-2,-72 Z M16,-62 L15,-86 L2,-72 Z" fill="${BLK}"/>
      <path d="M-13,-70 L-12.5,-80 L-6,-73 Z M13,-70 L12.5,-80 L6,-73 Z" fill="#ff8fab"/>
      <circle cx="0" cy="-62" r="18" fill="${BLK}"/>
      ${catEyes(-7,7,-64,1.15)}
      <path d="M-2,-56 l4,0 l-2,2.4 z" fill="#ff8fab"/>
      <path d="M-4,-52 q2,2 4,0 q2,2 4,0" stroke="#bbb" stroke-width="1.1" fill="none"/>
      <path d="M9,-56 l14,-3 M9,-54 l14,2 M-9,-56 l-14,-3 M-9,-54 l-14,2" stroke="#9a9a9a" stroke-width=".9"/>
    </g></g></g>`;
}
function girlFace(cx,cy,s){
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <path d="M-56,-4 Q-60,-64 0,-64 Q60,-64 56,-4 L60,58 Q40,66 30,48 L-30,48 Q-40,66 -60,58 Z" fill="${HAIR}"/>
    <circle r="48" fill="${SKIN}"/>
    <path d="M-50,-4 Q-52,-60 0,-58 Q52,-60 50,-4 Q42,-30 16,-34 Q6,-18 -12,-32 Q-34,-28 -50,-4 Z" fill="${HAIR}"/>
    <path d="M30,-50 L22,-64 L40,-58 Z M42,-46 L56,-56 L52,-40 Z" fill="#ff4d6d"/><circle cx="40" cy="-50" r="6" fill="#ff4d6d"/>
    <path d="M-27,4 Q-17,-9 -7,4 M7,4 Q17,-9 27,4" stroke="#222" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-31" cy="17" rx="9" ry="6" fill="#ff8fab" opacity=".75"/><ellipse cx="31" cy="17" rx="9" ry="6" fill="#ff8fab" opacity=".75"/>
    <path d="M-15,16 Q0,38 15,16 Z" fill="#a4161a"/><path d="M-8,26 Q0,32 8,26 Q0,23 -8,26 Z" fill="#ff6b81"/>
  </g>`;
}
function catFace(cx,cy,s){
  return `<g transform="translate(${cx} ${cy}) scale(${s})">
    <path d="M-44,-14 L-40,-70 L-6,-40 Z M44,-14 L40,-70 L6,-40 Z" fill="${BLK}"/>
    <path d="M-37,-26 L-35,-58 L-16,-41 Z M37,-26 L35,-58 L16,-41 Z" fill="#ff8fab"/>
    <ellipse rx="50" ry="44" fill="${BLK}"/>
    <path d="M-29,0 Q-18,-14 -7,0 M7,0 Q18,-14 29,0" stroke="#ffd60a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-31" cy="15" rx="8" ry="5" fill="#ff8fab" opacity=".55"/><ellipse cx="31" cy="15" rx="8" ry="5" fill="#ff8fab" opacity=".55"/>
    <path d="M-5,9 L5,9 L0,14 Z" fill="#ff8fab"/>
    <path d="M-11,17 Q-5.5,24 0,17 Q5.5,24 11,17" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M-5,21 Q0,30 5,21 Z" fill="#ff6b81"/>
    <path d="M22,12 L58,5 M22,18 L58,20 M-22,12 L-58,5 M-22,18 L-58,20" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  </g>`;
}
function plane(o={}){
  return `<path d="M-30,2 L-52,-26 L-38,-26 L10,2 Z" fill="#9fb3c8"/>
    <path d="M-92,-14 L-112,-52 L-92,-52 L-62,-14 Z" fill="${DRESS}"/>
    <path d="M-100,-6 Q-100,-16 -88,-16 L70,-16 Q108,-14 110,2 Q108,16 80,16 L-86,16 Q-100,16 -100,6 Z" fill="#f8f9fa" stroke="#1d3557" stroke-width="3" vector-effect="non-scaling-stroke"/>
    <path d="M-98,8 L96,8" stroke="${DRESS}" stroke-width="3" vector-effect="non-scaling-stroke"/>
    ${rep(o.door?8:9,i=>`<circle cx="${-64+i*15}" cy="-3" r="3.6" fill="#48cae4"/>`)}
    <path d="M86,-9 Q99,-9 103,-2 L88,-2 Z" fill="#1d3557"/>
    ${o.door?`<rect x="56" y="-12" width="12" height="22" rx="2" fill="#1d3557"/><rect x="58" y="-10" width="8" height="6" rx="1" fill="#48cae4"/>`:''}
    <ellipse cx="-12" cy="22" rx="13" ry="5.5" fill="#adb5bd"/>
    <path d="M-20,6 L-50,34 L-32,34 L22,6 Z" fill="#457b9d"/>`;
}
const cloud=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff"><ellipse cx="0" cy="0" rx="34" ry="20"/><ellipse cx="30" cy="-14" rx="30" ry="24"/><ellipse cx="62" cy="0" rx="32" ry="19"/><rect x="0" y="0" width="62" height="19"/></g>`;
const heart=(fill='#ff4d6d')=>`<path d="M0,35 C0,35 -50,5 -50,-15 C-50,-35 -30,-45 -15,-45 C-5,-45 0,-38 0,-30 C0,-38 5,-45 15,-45 C30,-45 50,-35 50,-15 C50,5 0,35 0,35 Z" fill="${fill}"/>`;
const starPts=(cx,cy,R,r)=>rep(10,i=>{const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;return `${(cx+Math.cos(a)*d).toFixed(1)},${(cy+Math.sin(a)*d).toFixed(1)} `});
const vnFlag=(x,y)=>`<rect x="${x}" y="${y}" width="34" height="23" fill="#da251d"/><polygon points="${starPts(x+17,y+11.5,8,3.3)}" fill="#ffde00"/>`;
const thFlag=(x,y)=>`<rect x="${x}" y="${y}" width="34" height="23" fill="#a51931"/><rect x="${x}" y="${y+4}" width="34" height="15" fill="#f4f5f8"/><rect x="${x}" y="${y+7.5}" width="34" height="8" fill="#2d2a4a"/>`;
function palm(x,h=170,y=480){
  const tx=x+22,ty=y-h;
  return `<path d="M${x},${y} Q${x-12},${y-h/2} ${tx},${ty}" stroke="#a0522d" stroke-width="13" fill="none" stroke-linecap="round"/>
    ${[195,158,-118,-68,-28,12].map(a=>`<ellipse cx="${tx}" cy="${ty}" rx="56" ry="12" fill="${a%2?'#2d9a4e':'#40b463'}" transform="rotate(${a} ${tx} ${ty}) translate(40 0)"/>`).join('')}
    <circle cx="${tx-7}" cy="${ty+8}" r="7" fill="#7f4f24"/><circle cx="${tx+7}" cy="${ty+10}" r="7" fill="#7f4f24"/>`;
}
function stall(x,c1,c2,goods){
  let s=`<rect x="${x}" y="320" width="8" height="160" fill="#7f5539"/><rect x="${x+192}" y="320" width="8" height="160" fill="#7f5539"/>
    <path d="M${x-14},302 L${x+100},268 L${x+214},302 Z" fill="${c1}"/>`;
  s+=rep(8,i=>`<rect x="${x-10+i*27.5}" y="300" width="27.5" height="38" fill="${i%2?c2:c1}"/><circle cx="${x+3.75+i*27.5}" cy="338" r="13.75" fill="${i%2?c2:c1}"/>`);
  s+=`<rect x="${x-4}" y="420" width="208" height="14" fill="#9c6644"/><rect x="${x+6}" y="434" width="188" height="46" fill="#b08968"/>`;

function flyAlong(pre,t,fromLeft){
  const A={x:820,y:398},B={x:180,y:398},C={x:500,y:90};

  const x=(1-t)**2*P0.x+2*(1-t)*t*C.x+t*t*P2.x, y=(1-t)**2*P0.y+2*(1-t)*t*C.y+t*t*P2.y;

  const ang=Math.atan2(dy,dx)*180/Math.PI;
  place(pre+'pl',x,y,.62,!fromLeft,fromLeft?ang:ang-180);

}
function movingWithStops(p,stops){

  return {w:m/(1-stops.reduce((s,[a,b])=>s+b-a,0)),st};
}

function render(pos){
  let acc=0, idx=S.length-1, p=1;
  for(let i=0;i<S.length;i++){ if(pos<acc+S[i].len){ idx=i; p=clamp((pos-acc)/S[i].len); break } acc+=S[i].len }
  if(idx!==active){
    if(active>=0) $('sc'+active).classList.remove('on');
    $('sc'+idx).classList.add('on'); active=idx;
    stage.style.background=`linear-gradient(${S[idx].sky} 50%, ${S[idx].ground} 50%)`;
  }
  S[idx].update(p);
  bar.style.width=(pos/total*100).toFixed(2)+'%';
  const started=pos>.04;
  intro.classList.toggle('gone',started);
  const want=started?idx:-1;
  if(want!==capFor){ capFor=want; setCaption(want) }
}
function readScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  tgt=max>0?clamp(scrollY/max)*total*0.99999:0;
}
function frame(){
  cur+=(tgt-cur)*.14; if(Math.abs(tgt-cur)<1e-4) cur=tgt;
  if(Math.abs(cur-last)>1e-5){ render(cur); last=cur }
  requestAnimationFrame(frame);
}
addEventListener('scroll',readScroll,{passive:true});
addEventListener('resize',readScroll);
S.forEach((s,i)=>{ $('sc'+i).classList.add('on'); s.update(0); $('sc'+i).classList.remove('on') });
readScroll(); cur=tgt; render(cur); last=cur; requestAnimationFrame(frame);
</script>
